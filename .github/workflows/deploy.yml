name: Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to master
        run: npx --yes gh-pages@latest --dist public --branch master --message "Deploy from ${GITHUB_SHA}" --user "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
