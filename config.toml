baseURL = "https://sanjeevkpandit.com.np/"
title = "Sanjeev Kumar Pandit"
theme = "PaperMod"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true

pygmentsstyle = "dracula"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[pagination]
  pagerSize = 10

[services]
  [services.googleAnalytics]
    id = "G-WSTRHS448Q"

[module]
  [module.hugoVersion]
    min = "0.160.1"

[params]
  author = "Sanjeev Kumar Pandit"
  description = "Full Stack Developer sharing things I learn."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowTags = true
  ShowRssButtonInSectionTermList = true
  ShowShareButtons = false

  [params.homeInfoParams]
    Title = "Hi, I'm Sanjeev"
    Content = "Full Stack Developer. I write about what I learn, technical and otherwise."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sanjeevkpandit"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://np.linkedin.com/in/sanjeevkpandit"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/sanjeevkpandit"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2
